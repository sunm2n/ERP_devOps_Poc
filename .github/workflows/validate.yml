name: validate

# 이 워크플로는 산출물의 **정적 검증만** 한다.
# .gitlab-ci.yml은 GitLab CE에서 실행된다 — 여기서 초록불이 떠도
# GitLab 파이프라인이 동작한다는 뜻이 아니다. README '저장소 경계' 참조.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          found=$(find . -name '*.sh' -not -path './.git/*')
          if [ -z "$found" ]; then echo "셸 스크립트 없음 — 건너뜀"; exit 0; fi
          echo "$found" | xargs shellcheck --severity=warning

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
            $(find . -name '*.yml' -o -name '*.yaml' | grep -v '^./.git/')

      - name: 시크릿 패턴 검사
        run: |
          # 커밋된 자격증명을 막는 최소한의 그물. 완전하지 않다.
          # include 를 걸지 않는다. 이 저장소는 콘텐츠 대부분이 *.md 이고 *.key/*.pem
          # 등은 .gitignore 가 이미 막으므로, 확장자 목록은 커버리지를 넓히는 게 아니라
          # 오히려 좁힌다. 실제로 새는 경로는 런북 docs/*.md, scripts/*.py, 이슈 본문,
          # 확장자 없는 id_rsa 쪽이다.
          if grep -rInE '(password|passwd|secret|token|api[_-]?key)[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/_+.-]{8,}' \
               --exclude-dir=.git . \
             | grep -vE '(example|sample|placeholder|CHANGE_?ME|\$\{|\$CI_|<.*>)'; then
            echo "::error::시크릿으로 보이는 값이 커밋되었습니다"
            exit 1
          fi

          # armored 개인키 블록. 번들 서명 키가 새면 폐쇄망 고객사에서는 검출 불가능하다.
          # 런북에 금지 예시로 적는 경우가 있어 example 계열은 예외로 둔다 —
          # 예외가 없으면 CI 가 영구 실패하고 우회 경로가 없다.
          if grep -rIn --exclude-dir=.git 'BEGIN [A-Z ]*PRIVATE KEY' . \
             | grep -vE '(example|EXAMPLE|sample|placeholder|<.*>)'; then
            echo "::error::개인키가 커밋되었습니다"
            exit 1
          fi
          echo "이상 없음"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -d src ] && find src -name '*.csproj' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "src/ 에 .csproj 없음 — 빌드 건너뜀"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.exists == 'true'
        with:
          # SDK 핀은 한 곳이어야 한다. `dotnet-version: '10.0.x'` 는 그때그때 최신 패치를
          # 깔고 global.json 은 rollForward:disable 로 정확 일치를 요구하므로, MS 가 다음
          # 패치를 내는 날 **커밋 없이** 모든 PR 이 RC=155 로 죽는다.
          global-json-file: global.json
      - if: steps.check.outputs.exists == 'true'
        # `dotnet build <디렉터리>` 는 그 디렉터리에 프로젝트/솔루션이 **직접** 있을 때만
        # 동작한다 — src/ErpCore/ErpCore.csproj 만 있던 시점에 이 스텝이 MSB1003 으로 깨졌다.
        run: |
          set -euo pipefail

          sln="$(find src -maxdepth 2 \( -name '*.sln' -o -name '*.slnx' \) | sort | head -1)"

          if [ -z "$sln" ]; then
            find src -name '*.csproj' -print0 | sort -z \
              | xargs -0 -n1 dotnet restore --locked-mode
            find src -name '*.csproj' -print0 | sort -z \
              | xargs -0 -n1 dotnet build --configuration Release --no-restore
            exit 0
          fi

          echo "solution: $sln"

          # 솔루션에 등록되지 않은 프로젝트는 **컴파일조차 되지 않은 채 초록불**이 된다.
          # 개수만 대조하면 안 된다 — .slnx 의 <Folder Path=>·<File Path=> 까지 세므로
          # 솔루션 폴더 2줄이 미등록 프로젝트 2개를 정확히 상쇄해 **미탐**한다(실측).
          # `dotnet sln list` 로 등록 목록을 뽑아 경로 집합으로 비교하면 포맷 파싱이
          # 사라지고 고전 .sln 도 함께 커버된다.
          # `|| true` 로 삼키지 않는다. 솔루션 파일이 깨졌을 때 그것을 커버리지 불일치로
          # 보고하면 진단이 엉뚱한 곳을 가리킨다 (실측: 잘못된 Folder 문법 -> sln list 가
          # rc=1 + 사유를 내는데, 삼키면 '등록 0개' 로만 보인다).
          if ! sln_out="$(dotnet sln "$sln" list 2>&1)"; then
            echo "::error::솔루션 파일을 읽을 수 없습니다: $sln"
            printf '%s\n' "$sln_out"
            exit 1
          fi
          printf '%s\n' "$sln_out" \
            | grep -E '\.csproj$' \
            | tr '\\' '/' \
            | sed 's#^#src/#' \
            | sort -u > /tmp/listed.txt
          find src -name '*.csproj' | sort -u > /tmp/found.txt

          if ! diff -u /tmp/listed.txt /tmp/found.txt > /tmp/cov.diff; then
            echo "::error::솔루션 등록 목록과 src 아래 실제 프로젝트가 다릅니다."
            echo "::error::등록되지 않은 프로젝트는 빌드되지 않은 채 CI 가 통과합니다."
            echo '--- 솔루션 등록 (-) vs 실제 발견 (+) ---'
            cat /tmp/cov.diff
            exit 1
          fi

          # 잠금 파일이 없는 프로젝트는 잠금 모드 복원을 **조용히 통과**한다.
          # RestorePackagesWithLockFile 은 Directory.Build.props 에 있지만, 그걸
          # 우회하는 프로젝트가 생기면 재현성 보증이 그 프로젝트에만 없어진다.
          missing=0
          while IFS= read -r proj; do
            [ -f "$(dirname "$proj")/packages.lock.json" ] || {
              echo "::error::잠금 파일 없음: $proj"
              missing=1
            }
          done < /tmp/found.txt
          [ "$missing" -eq 0 ] || exit 1

          # 잠금 파일과 어긋나면 실패시킨다. 같은 커밋이 다른 의존성으로 복원되면
          # plan.md 1단계의 "같은 커밋 -> 같은 이미지" 근거가 사라진다.
          dotnet restore "$sln" --locked-mode
          dotnet build "$sln" --configuration Release --no-restore
